apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-first-app-develop
  namespace: app
  labels:
    app: first-app
    environment: develop
    version: develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: first-app
      environment: develop
  template:
    metadata:
      labels:
        app: first-app
        environment: develop
        version: develop
    spec:
      containers:
      - name: first-app
        image: first-app:latest
        imagePullPolicy: IfNotPresent  # 使用本地镜像
        ports:
        - containerPort: 18080
          name: http
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "18080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 18080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ping
            port: 18080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-first-app-develop
  namespace: app
  labels:
    app: first-app
    environment: develop
spec:
  selector:
    app: first-app
    environment: develop
  ports:
  - name: http
    port: 18080
    targetPort: 18080
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-first-app-develop
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: "app-headers-develop@kubernetescrd"
spec:
  rules:
  - host: "first-app-develop.localhost"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-first-app-develop
            port:
              number: 18080