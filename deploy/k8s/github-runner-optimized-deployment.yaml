# GitHub Runner Optimized Deployment
# 预下载kubectl工具的优化版本

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubectl-binary
  namespace: github-runners
  labels:
    app: github-runner-optimized
    type: binary-cache
  annotations:
    description: "预下载的kubectl二进制文件缓存"

data:
  # 注意：kubectl二进制文件需要先下载并编码为base64
  # 这里是占位符，实际使用前需要填充真实的base64编码内容
  kubectl: ""  # TODO: 填充kubectl二进制文件的base64编码

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig-template
  namespace: github-runners
  labels:
    app: github-runner-optimized
    type: config-template
  annotations:
    description: "预生成的in-cluster kubeconfig模板"

data:
  config.yaml: |
    apiVersion: v1
    clusters:
    - cluster:
        certificate-authority: /run/secrets/kubernetes.io/serviceaccount/ca.crt
        server: https://kubernetes.default.svc
      name: in-cluster
    contexts:
    - context:
        cluster: in-cluster
        user: in-cluster-user
      name: in-cluster
    current-context: in-cluster
    kind: Config
    preferences: {}
    users:
    - name: in-cluster-user
      user:
        tokenFile: /run/secrets/kubernetes.io/serviceaccount/token

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-optimized
  namespace: github-runners
  labels:
    app: github-runner-optimized
    version: "2.1"
    feature: preloaded-kubectl
  annotations:
    description: "GitHub Actions Runner with preloaded kubectl (optimized deployment)"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner-optimized

  template:
    metadata:
      labels:
        app: github-runner-optimized
        version: "2.1"
        feature: preloaded-kubectl
      annotations:
        description: "GitHub Actions Runner Pod with preloaded kubectl and optimized startup"

    spec:
      # 使用增强权限的ServiceAccount
      serviceAccountName: github-runner-admin

      # 初始化容器 - 仅用于准备kubectl环境
      initContainers:
      - name: setup-kubectl
        image: busybox:1.35
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "🔧 初始化kubectl环境..."

          # 创建必要的目录
          mkdir -p /home/runner/.kube
          mkdir -p /usr/local/bin

          # 从ConfigMap复制kubectl二进制文件
          if [[ -f "/opt/kubectl/kubectl" ]]; then
            echo "✅ 复制kubectl二进制文件..."
            cp /opt/kubectl/kubectl /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl
          else
            echo "❌ kubectl二进制文件不存在，回退到下载模式..."
            # 回退方案：如果预下载的kubectl不存在，则下载
            KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
            curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          fi

          # 复制kubeconfig模板
          if [[ -f "/opt/kubeconfig/config.yaml" ]]; then
            echo "✅ 复制kubeconfig模板..."
            cp /opt/kubeconfig/config.yaml /home/runner/.kube/config
            chmod 600 /home/runner/.kube/config
          else
            echo "❌ kubeconfig模板不存在，动态生成..."
            # 动态生成kubeconfig
            cat > /home/runner/.kube/config << 'EOF'
            apiVersion: v1
            clusters:
            - cluster:
                certificate-authority: /run/secrets/kubernetes.io/serviceaccount/ca.crt
                server: https://kubernetes.default.svc
              name: in-cluster
            contexts:
            - context:
                cluster: in-cluster
                user: in-cluster-user
              name: in-cluster
            current-context: in-cluster
            kind: Config
            preferences: {}
            users:
            - name: in-cluster-user
              user:
                tokenFile: /run/secrets/kubernetes.io/serviceaccount/token
            EOF
            chmod 600 /home/runner/.kube/config
          fi

          # 设置权限
          chown -R 1000:1000 /home/runner/.kube
          chown 1000:1000 /usr/local/bin/kubectl

          echo "✅ kubectl环境初始化完成"

        volumeMounts:
        - name: kubectl-binary
          mountPath: /opt/kubectl
          readOnly: true
        - name: kubeconfig-template
          mountPath: /opt/kubeconfig
          readOnly: true

      # 主容器
      containers:
      - name: github-runner
        image: myoung34/github-runner:latest
        env:
        # GitHub配置
        - name: REPO_URL
          value: "https://github.com/gszw90/k8s-app"
        - name: RUNNER_NAME
          value: "github-runner-optimized"
        - name: RUNNER_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-runner-secret
              key: RUNNER_TOKEN
        - name: RUNNER_GROUP
          value: "default"

        # Kubernetes配置
        - name: KUBERNETES_IN_CLUSTER
          value: "true"
        - name: KUBECONFIG
          value: "/home/runner/.kube/config"

        # Docker配置
        - name: DOCKER_HOST
          value: "unix:///var/run/docker.sock"
        - name: DOCKER_TLS_VERIFY
          value: "0"

        # 环境标识
        - name: RUNNER_FEATURES
          value: "kubectl,docker,in-cluster,optimized"
        - name: RUNNER_VERSION
          value: "2.1-optimized"

        # 资源限制
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"  # 优化：减少内存需求
          limits:
            cpu: "500m"
            memory: "512Mi"

        # 卷挂载
        volumeMounts:
        # Docker socket
        - name: docker-socket
          mountPath: /var/run/docker.sock

        # 工作目录
        - name: runner-work
          mountPath: /home/runner/_work

        # kubectl配置（已经由initContainer准备）
        - name: kubeconfig-data
          mountPath: /home/runner/.kube
          readOnly: false

        # 健康检查
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          initialDelaySeconds: 30  # 优化：减少启动延迟
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          initialDelaySeconds: 15  # 优化：更快的就绪检查
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # 启动命令 - 优化版本（无需下载kubectl）
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🚀 启动GitHub Runner Optimized (v2.1) - 预加载kubectl版本"

          # 验证kubectl是否就绪
          if command -v kubectl &> /dev/null; then
            echo "✅ kubectl已就绪: $(kubectl version --client --short 2>/dev/null || echo 'version check failed')"
          else
            echo "❌ kubectl未就绪，启动失败"
            exit 1
          fi

          # 设置环境变量
          export KUBECONFIG="/home/runner/.kube/config"
          echo "export KUBECONFIG=\"/home/runner/.kube/config\"" >> /home/runner/.bashrc

          # 验证Kubernetes连接
          echo "🔍 验证Kubernetes连接..."
          if kubectl cluster-info &> /dev/null; then
            echo "✅ Kubernetes连接成功"
          else
            echo "❌ Kubernetes连接失败"
            exit 1
          fi

          # 测试权限
          echo "🔐 测试Kubernetes权限..."
          if kubectl auth can-i create deployments --all-namespaces; then
            echo "✅ 部署权限正常"
          else
            echo "⚠️  部署权限可能不足"
          fi

          # 创建实用脚本
          echo "📝 创建实用脚本..."

          # 优化的连接测试脚本
          cat > /home/runner/test-k8s.sh << 'EOF'
          #!/bin/bash
          echo "🔍 测试Kubernetes连接状态（优化版本）..."
          export KUBECONFIG="/home/runner/.kube/config"

          # 快速连接测试
          if kubectl cluster-info &> /dev/null; then
            echo "✅ Kubernetes连接正常"
            echo "📋 可用命名空间:"
            kubectl get namespaces | grep -E "(app-|default)" | head -3
          else
            echo "❌ Kubernetes连接失败"
            exit 1
          fi
          EOF
          chmod +x /home/runner/test-k8s.sh

          # GitHub Actions环境准备脚本
          cat > /home/runner/github-actions-k8s-setup.sh << 'EOF'
          #!/bin/bash
          export KUBECONFIG="/home/runner/.kube/config"
          echo "🚀 GitHub Actions Kubernetes环境已准备就绪（优化版本）"
          echo "📋 当前上下文: $(kubectl config current-context)"
          echo "⏱️  启动时间: $(date)"
          EOF
          chmod +x /home/runner/github-actions-k8s-setup.sh

          # 快速验证脚本
          cat > /home/runner/quick-verify.sh << 'EOF'
          #!/bin/bash
          echo "⚡ 快速验证Kubernetes环境..."
          export KUBECONFIG="/home/runner/.kube/config"

          # 基本连接测试
          kubectl cluster-info > /dev/null && echo "✅ API连接正常" || echo "❌ API连接失败"

          # 权限测试
          kubectl auth can-i create deployments > /dev/null && echo "✅ 部署权限正常" || echo "⚠️  部署权限不足"

          # 时间戳
          echo "🕐 验证时间: $(date)"
          EOF
          chmod +x /home/runner/quick-verify.sh

          echo "🎉 GitHub Runner Optimized 初始化完成！"
          echo "📋 优化特性:"
          echo "  ✅ 预加载kubectl ($(kubectl version --client --short 2>/dev/null || echo 'version check failed'))"
          echo "  ✅ in-cluster Kubernetes连接"
          echo "  ✅ Docker访问权限"
          echo "  ✅ 快速启动（预配置环境）"
          echo "  ⚡ 优化的资源使用"
          echo ""
          echo "📝 可用脚本:"
          echo "  ~/test-k8s.sh                    - 测试Kubernetes连接"
          echo "  ~/github-actions-k8s-setup.sh   - GitHub Actions环境设置"
          echo "  ~/quick-verify.sh               - 快速验证环境"
          echo ""
          echo "🚀 启动GitHub Actions Runner（优化版本）..."

          # 启动GitHub Runner
          exec /entrypoint.sh

      # 卷配置
      volumes:
      # Docker socket
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket

      # 工作目录
      - name: runner-work
        emptyDir:
          sizeLimit: 2Gi  # 优化：减少存储需求

      # 预下载的kubectl二进制文件
      - name: kubectl-binary
        configMap:
          name: kubectl-binary
          defaultMode: 0755

      # kubeconfig模板
      - name: kubeconfig-template
        configMap:
          name: kubeconfig-template
          defaultMode: 0600

      # 运行时kubeconfig数据（可写）
      - name: kubeconfig-data
        emptyDir:
          sizeLimit: 10Mi

      # 节点选择器
      nodeSelector:
        kubernetes.io/os: linux

      # 容忍度
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

      # 安全上下文
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

# ============================================
# 部署说明
# ============================================

# 部署前准备：
# 1. 下载kubectl二进制文件
# 2. 将kubectl编码为base64
# 3. 更新kubectl-binary ConfigMap

# 准备kubectl二进制文件的脚本：
#!/bin/bash
echo "准备kubectl二进制文件..."

# 下载kubectl
KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

# 编码为base64
KUBECTL_BASE64=$(base64 -w 0 kubectl)

# 更新ConfigMap
kubectl patch configmap kubectl-binary -n github-runners -p "{\"data\":{\"kubectl\":\"${KUBECTL_BASE64}\"}}"

# 验证
echo "kubectl已准备完成"