# GitHub Runner Enhanced ServiceAccount Configuration
# 基于Pod内Kubernetes通信方案的权限配置

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-admin
  namespace: github-runners
  labels:
    app: github-runner
    role: admin
    version: enhanced
  annotations:
    description: "GitHub Actions Runner with full cluster admin permissions for CI/CD deployment"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-runner-admin-role
  labels:
    app: github-runner
    role: admin
    version: enhanced
rules:
# 核心命名空间权限
- apiGroups: [""]
  resources: ["namespaces", "pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Apps权限（用于Deployments, StatefulSets等）
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "scale"]

# 网络权限
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# 扩展API权限
- apiGroups: ["extensions"]
  resources: ["ingresses", "deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Batch权限（用于Jobs, CronJobs）
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# RBAC权限（用于权限管理）
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "escalate", "bind"]

# 自定义资源权限
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-admin-binding
  labels:
    app: github-runner
    role: admin
    version: enhanced
subjects:
- kind: ServiceAccount
  name: github-runner-admin
  namespace: github-runners
roleRef:
  kind: ClusterRole
  name: github-runner-admin-role
  apiGroup: rbac.authorization.k8s.io