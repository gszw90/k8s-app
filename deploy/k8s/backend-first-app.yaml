# Backend First App Kubernetes 配置文件
# 支持多环境部署：develop, staging, prod
# 使用环境变量进行配置替换

---
# ConfigMap - 环境特定配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${CONFIGMAP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${FULL_SERVICE_NAME}
    environment: ${ENVIRONMENT}
    service-type: ${SERVICE_TYPE}
data:
  PORT: "18080"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  ENVIRONMENT: "${ENVIRONMENT}"
  SERVICE_NAME: "${FULL_SERVICE_NAME}"
  SERVICE_TYPE: "${SERVICE_TYPE}"

---
# Secret - 敏感数据 (生产环境需要加密)
apiVersion: v1
kind: Secret
metadata:
  name: ${SECRET_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${FULL_SERVICE_NAME}
    environment: ${ENVIRONMENT}
    service-type: ${SERVICE_TYPE}
type: Opaque
data:
  # 示例：base64编码的数据库密码 (请替换为实际值)
  # echo -n "your-password" | base64
  DB_PASSWORD: "${DB_PASSWORD:-}"
  API_KEY: "${API_KEY:-}"
  SESSION_SECRET: "${SESSION_SECRET:-}"

---
# Deployment - 应用部署配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOYMENT_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${FULL_SERVICE_NAME}
    environment: ${ENVIRONMENT}
    service-type: ${SERVICE_TYPE}
    version: "${IMAGE_TAG}"
spec:
  replicas: ${REPLICAS:-1}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ${FULL_SERVICE_NAME}
      environment: ${ENVIRONMENT}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${FULL_SERVICE_NAME}
        environment: ${ENVIRONMENT}
        service-type: ${SERVICE_TYPE}
        version: "${IMAGE_TAG}"
    spec:
      containers:
      - name: ${FULL_SERVICE_NAME}
        image: first-app:849f60a
        imagePullPolicy: Never
        ports:
        - containerPort: 18080
          name: http
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ${CONFIGMAP_NAME}
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ${CONFIGMAP_NAME}
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ${CONFIGMAP_NAME}
              key: ENVIRONMENT
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: ${CONFIGMAP_NAME}
              key: SERVICE_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: DB_PASSWORD
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: API_KEY
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: SESSION_SECRET
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 18080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ping
            port: 18080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

---
# Service - 服务发现
apiVersion: v1
kind: Service
metadata:
  name: ${FULL_SERVICE_NAME}-service
  namespace: ${NAMESPACE}
  labels:
    app: ${FULL_SERVICE_NAME}
    environment: ${ENVIRONMENT}
    service-type: ${SERVICE_TYPE}
spec:
  selector:
    app: ${FULL_SERVICE_NAME}
    environment: ${ENVIRONMENT}
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 18080
  type: ClusterIP

---
# IngressRoute - Traefik v2 外部访问配置
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${FULL_SERVICE_NAME}-ingress
  namespace: ${NAMESPACE}
  labels:
    app: ${FULL_SERVICE_NAME}
    environment: ${ENVIRONMENT}
    service-type: ${SERVICE_TYPE}
spec:
  entryPoints:
    - web
  routes:
  - match: PathPrefix(`/${FULL_SERVICE_NAME}`)
    kind: Rule
    services:
    - name: ${FULL_SERVICE_NAME}-service
      port: 80
    middlewares:
    - name: ${FULL_SERVICE_NAME}-stripprefix

---
# Middleware - StripPrefix for ${FULL_SERVICE_NAME}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${FULL_SERVICE_NAME}-stripprefix
  namespace: ${NAMESPACE}
spec:
  stripPrefix:
    prefixes:
      - /${FULL_SERVICE_NAME}
    forceSlash: false

