# Backend First App Kubernetes 配置文件
# 支持多环境部署：develop, staging, prod
# 使用环境变量进行配置替换

---
# ConfigMap - 环境特定配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-first-app-config
  namespace: ${NAMESPACE}
  labels:
    app: backend-first-app
    environment: ${ENVIRONMENT}
data:
  PORT: "${PORT}"
  LOG_LEVEL: "${LOG_LEVEL}"
  ENVIRONMENT: "${ENVIRONMENT}"
  SERVICE_NAME: "backend-first-app"

---
# Secret - 敏感数据 (生产环境需要加密)
apiVersion: v1
kind: Secret
metadata:
  name: backend-first-app-secret
  namespace: ${NAMESPACE}
  labels:
    app: backend-first-app
    environment: ${ENVIRONMENT}
type: Opaque
data:
  # 示例：base64编码的数据库密码 (请替换为实际值)
  # echo -n "your-password" | base64
  DB_PASSWORD: "${DB_PASSWORD}"
  API_KEY: "${API_KEY}"
  SESSION_SECRET: "${SESSION_SECRET}"

---
# Deployment - 应用部署配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-first-app
  namespace: ${NAMESPACE}
  labels:
    app: backend-first-app
    environment: ${ENVIRONMENT}
    version: "${IMAGE_TAG}"
spec:
  replicas: ${REPLICAS}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: backend-first-app
      environment: ${ENVIRONMENT}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend-first-app
        environment: ${ENVIRONMENT}
        version: "${IMAGE_TAG}"
    spec:
      containers:
      - name: backend-first-app
        image: first-app:849f60a
        imagePullPolicy: Never
        ports:
        - containerPort: 18080
          name: http
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: backend-first-app-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: backend-first-app-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: backend-first-app-config
              key: ENVIRONMENT
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-first-app-config
              key: SERVICE_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-first-app-secret
              key: DB_PASSWORD
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: backend-first-app-secret
              key: API_KEY
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-first-app-secret
              key: SESSION_SECRET
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 18080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ping
            port: 18080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

---
# Service - 服务发现
apiVersion: v1
kind: Service
metadata:
  name: backend-first-app-service
  namespace: ${NAMESPACE}
  labels:
    app: backend-first-app
    environment: ${ENVIRONMENT}
spec:
  selector:
    app: backend-first-app
    environment: ${ENVIRONMENT}
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 18080
  type: ClusterIP

---
# IngressRoute - Traefik v2 外部访问配置
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-first-app-ingress
  namespace: ${NAMESPACE}
  labels:
    app: backend-first-app
    environment: ${ENVIRONMENT}
spec:
  entryPoints:
    - web
  routes:
  - match: PathPrefix(`/backend-first-app`)
    kind: Rule
    services:
    - name: backend-first-app-service
      port: 80
    middlewares:
    - name: backend-first-app-stripprefix

---
# Middleware - StripPrefix for backend-first-app
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: backend-first-app-stripprefix
  namespace: ${NAMESPACE}
spec:
  stripPrefix:
    prefixes:
      - /backend-first-app
    forceSlash: false

