# GitHub Runner Secret
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-secret
  namespace: github-runners
  labels:
    app: github-runner
    component: secret
type: Opaque
data:
  # GitHub Runner Token (base64 encoded)
  # Original: AGZXWBL5U6244YQD4OIS4SDI6DIAG
  RUNNER_TOKEN: "QUdaWFdCTDVVNjI0NFlRRDRPSVM0U0RJNkRJQUc="

  # 如果需要访问私有仓库，可以在这里添加其他密钥
  # 例如：DOCKER_REGISTRY_USERNAME, DOCKER_REGISTRY_PASSWORD 等
  DOCKER_REGISTRY_USERNAME: ""
  DOCKER_REGISTRY_PASSWORD: ""

  # GitHub Token (如果需要访问其他仓库资源)
  GITHUB_TOKEN: ""

  # 其他敏感环境变量
  OTHER_SECRETS: ""