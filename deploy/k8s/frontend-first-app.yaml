# Frontend First App Kubernetes 配置文件
# 支持多环境部署：develop, staging, prod
# 使用环境变量进行配置替换

---
# ConfigMap - 环境特定配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-first-app-config
  namespace: ${NAMESPACE}
  labels:
    app: frontend-first-app
    environment: ${ENVIRONMENT}
data:
  PORT: "${PORT}"
  LOG_LEVEL: "${LOG_LEVEL}"
  ENVIRONMENT: "${ENVIRONMENT}"
  SERVICE_NAME: "frontend-first-app"
  API_BASE_URL: "${API_BASE_URL}"
  VERSION: "${VERSION}"

---
# Secret - 敏感数据 (生产环境需要加密)
apiVersion: v1
kind: Secret
metadata:
  name: frontend-first-app-secret
  namespace: ${NAMESPACE}
  labels:
    app: frontend-first-app
    environment: ${ENVIRONMENT}
type: Opaque
data:
  # 示例：base64编码的API密钥 (请替换为实际值)
  # echo -n "your-api-key" | base64
  API_KEY: "${API_KEY}"
  SESSION_SECRET: "${SESSION_SECRET}"

---
# Deployment - 应用部署配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-first-app
  namespace: ${NAMESPACE}
  labels:
    app: frontend-first-app
    environment: ${ENVIRONMENT}
    version: "${IMAGE_TAG}"
spec:
  replicas: ${REPLICAS}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: frontend-first-app
      environment: ${ENVIRONMENT}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend-first-app
        environment: ${ENVIRONMENT}
        version: "${IMAGE_TAG}"
    spec:
      containers:
      - name: frontend-first-app
        image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: frontend-first-app-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: frontend-first-app-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: frontend-first-app-config
              key: ENVIRONMENT
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: frontend-first-app-config
              key: SERVICE_NAME
        - name: API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-first-app-config
              key: API_BASE_URL
        - name: VERSION
          valueFrom:
            configMapKeyRef:
              name: frontend-first-app-config
              key: VERSION
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: frontend-first-app-secret
              key: API_KEY
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-first-app-secret
              key: SESSION_SECRET
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

---
# Service - 服务发现
apiVersion: v1
kind: Service
metadata:
  name: frontend-first-app-service
  namespace: ${NAMESPACE}
  labels:
    app: frontend-first-app
    environment: ${ENVIRONMENT}
spec:
  selector:
    app: frontend-first-app
    environment: ${ENVIRONMENT}
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP

---
# Ingress - 外部访问
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-first-app-ingress
  namespace: ${NAMESPACE}
  labels:
    app: frontend-first-app
    environment: ${ENVIRONMENT}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
  - host: "${ENVIRONMENT}-frontend-first-app.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-first-app-service
            port:
              number: 80

---
