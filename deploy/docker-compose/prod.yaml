# 生产环境 Docker Compose 配置
version: '3.8'

services:
  first-app:
    build:
      context: .
      dockerfile: docker/first-app/Dockerfile.prod
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=error
      - NODE_ENV=production
    networks:
      - prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:18080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  second-app:
    build:
      context: .
      dockerfile: docker/second-app/Dockerfile.prod
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=error
      - NODE_ENV=production
    networks:
      - prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:18081/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web-app:
    build:
      context: .
      dockerfile: docker/web-app/Dockerfile.prod
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=error
      - PORT=3000
    networks:
      - prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - prod-network
    restart: unless-stopped
    depends_on:
      - first-app
      - second-app
      - web-app
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

networks:
  prod-network:
    driver: bridge

volumes:
  first-app-data:
  second-app-data:
  web-app-data: