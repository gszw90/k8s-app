apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-web-develop
  namespace: app
  labels:
    app: web
    environment: develop
    version: develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      environment: develop
  template:
    metadata:
      labels:
        app: web
        environment: develop
        version: develop
    spec:
      containers:
      - name: web-app
        image: web-app:latest
        imagePullPolicy: IfNotPresent  # 使用本地镜像
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3000"
        - name: VERSION
          value: "1.0.0-develop"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-web-develop
  namespace: app
  labels:
    app: web
    environment: develop
spec:
  selector:
    app: web
    environment: develop
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-web-develop
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: "app-headers-develop@kubernetescrd"
spec:
  rules:
  - host: "web-develop.localhost"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-web-develop
            port:
              number: 3000