name: 🚀 极简 CI/CD 部署

on:
  push:
    branches: [
      'develop-backend-first-app',
      'staging-backend-first-app',
      'prod-backend-first-app'
    ]

jobs:
  🚀-部署:
    runs-on: arc-runner-set

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🌍 设置环境变量
      run: |
        case "${GITHUB_REF#refs/heads/}" in
          develop-backend-first-app)
            export NAMESPACE="k8s-app-dev"
            export IMAGE_TAG="dev-${GITHUB_SHA::7}"
            export K8S_CONFIG="deploy/k8s/backend-first-app.yaml"
            ;;
          staging-backend-first-app)
            export NAMESPACE="k8s-app-staging"
            export IMAGE_TAG="staging-${GITHUB_SHA::7}"
            export K8S_CONFIG="deploy/k8s/backend-first-app.yaml"
            ;;
          prod-backend-first-app)
            export NAMESPACE="k8s-app-prod"
            export IMAGE_TAG="${GITHUB_SHA::7}"
            export K8S_CONFIG="deploy/k8s/backend-first-app.yaml"
            ;;
        esac

        echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "K8S_CONFIG=$K8S_CONFIG" >> $GITHUB_ENV
        echo "📍 环境: ${GITHUB_REF#refs/heads/}"
        echo "🏷️  标签: $IMAGE_TAG"

    - name: 🐳 构建镜像
      run: |
        echo "🐳 构建镜像: backend-first-app:$IMAGE_TAG"

        if [[ ! -f "deploy/Dockerfile-first-app" ]]; then
          echo "❌ Dockerfile不存在"
          exit 1
        fi

        docker build \
          -t backend-first-app:$IMAGE_TAG \
          -f deploy/Dockerfile-first-app \
          backend/

        echo "✅ 构建完成: backend-first-app:$IMAGE_TAG"

    - name: ⚡ 配置Kubernetes
      run: |
        echo "⚡ 配置Kubernetes - Pod内直连"

        # 极简KUBECONFIG配置
        mkdir -p ~/.kube
        cat > ~/.kube/config << 'EOF'
apiVersion: v1
clusters:
- cluster:
    certificate-authority: /run/secrets/kubernetes.io/serviceaccount/ca.crt
    server: https://kubernetes.default.svc.cluster.local
  name: cluster
contexts:
- context:
    cluster: cluster
    user: user
  name: default
current-context: default
users:
- name: user
  user:
    tokenFile: /run/secrets/kubernetes.io/serviceaccount/token
EOF

        export KUBECONFIG="$HOME/.kube/config"
        export PATH="/opt/kubectl:$PATH"

        # 快速验证
        if kubectl cluster-info --request-timeout=10s; then
          echo "✅ Kubernetes连接成功"
        else
          echo "❌ Kubernetes连接失败"
          exit 1
        fi

    - name: 🚀 部署应用
      run: |
        echo "🚀 部署到命名空间: $NAMESPACE"

        # 创建命名空间
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        # 环境变量替换并部署
        envsubst < $K8S_CONFIG > final-config.yaml
        kubectl apply -f final-config.yaml -n $NAMESPACE

        echo "✅ 部署完成"

    - name: 🔍 验证部署
      run: |
        echo "🔍 验证部署状态..."

        # 等待部署完成
        kubectl rollout status deployment/backend-first-app -n $NAMESPACE --timeout=60s

        # 检查Pod状态
        POD_STATUS=$(kubectl get pods -n $NAMESPACE -l app=backend-first-app -o jsonpath='{.items[0].status.phase}')
        echo "📈 Pod状态: $POD_STATUS"

        if [[ "$POD_STATUS" == "Running" ]]; then
          echo "✅ 部署成功"

          # 获取Pod信息
          POD_NAME=$(kubectl get pods -n $NAMESPACE -l app=backend-first-app -o jsonpath='{.items[0].metadata.name}')
          POD_IP=$(kubectl get pods -n $NAMESPACE -l app=backend-first-app -o jsonpath='{.items[0].status.podIP}')

          echo "📛 Pod名称: $POD_NAME"
          echo "🌐 Pod IP: $POD_IP"
        else
          echo "❌ 部署失败"
          kubectl describe pods -n $NAMESPACE -l app=backend-first-app
          exit 1
        fi

    - name: 📋 部署摘要
      run: |
        echo "📋 ===== 部署摘要 ====="
        echo "🎯 服务: backend-first-app"
        echo "📍 环境: ${GITHUB_REF#refs/heads/}"
        echo "📦 命名空间: $NAMESPACE"
        echo "🏷️  镜像标签: $IMAGE_TAG"
        echo "⏰ 完成时间: $(date)"
        echo "========================="