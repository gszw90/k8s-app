# 前端服务统一部署 Workflow
name: Deploy Frontend Services

on:
  push:
    branches: [develop, staging, prod]
    paths:
      - 'frontend/**'
      - 'docker/**'
      - 'k8s/frontend-*.yaml'
      - 'scripts/**'
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'docker/**'
      - 'k8s/frontend-*.yaml'
      - 'scripts/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web-app: ${{ steps.changes.outputs.web-app }}
      should-deploy: ${{ steps.changes.outputs.should-deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检测文件变更
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            web-app:
              - 'frontend/first_app/**'
              - 'docker/web-app/**'
            deploy-files:
              - 'k8s/frontend-web-app.yaml'
              - 'scripts/deploy.sh'
            shared-config:
              - 'scripts/build.sh'

      - name: 设置部署标志
        run: |
          if [[ "${{ steps.changes.outputs.web-app }}" == "true" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/first_app/package-lock.json'

      - name: 安装依赖
        run: |
          cd frontend/first_app
          npm ci

      - name: 运行测试
        run: |
          cd frontend/first_app
          npm test

      - name: 代码检查
        run: |
          cd frontend/first_app
          npm run lint || true

  build:
    needs: [detect-changes, test]
    if: |
      needs.detect-changes.outputs.should-deploy == 'true' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取环境
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=develop" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/web-app/Dockerfile.develop" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/web-app/Dockerfile.staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/web-app/Dockerfile.prod" >> $GITHUB_OUTPUT
          else
            echo "environment=develop" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/web-app/Dockerfile.develop" >> $GITHUB_OUTPUT
          fi

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/web-app
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建和推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.env.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect-changes, build]
    if: |
      needs.detect-changes.outputs.should-deploy == 'true' &&
      github.event_name == 'push' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ steps.setup-env.outputs.environment }}
      url: ${{ steps.setup-env.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置环境变量
        id: setup-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=develop" >> $GITHUB_OUTPUT
            echo "url=http://web-develop.localhost" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "url=https://web-staging.example.com" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "url=https://web.example.com" >> $GITHUB_OUTPUT
          fi

      - name: 设置 kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 配置 kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: 部署到 Kubernetes
        run: |
          export COMMIT_SHA=${{ github.sha }}
          export ENVIRONMENT=${{ steps.setup-env.outputs.environment }}

          echo "部署 web-app..."
          # 更新镜像标签
          sed -i "s|image: .*:develop|image: ${{ env.REGISTRY }}/web-app:${{ github.sha }}-develop|g" k8s/frontend-web-app.yaml
          sed -i "s|image: .*:staging|image: ${{ env.REGISTRY }}/web-app:${{ github.sha }}-staging|g" k8s/frontend-web-app.yaml
          sed -i "s|image: .*:prod|image: ${{ env.REGISTRY }}/web-app:${{ github.sha }}-prod|g" k8s/frontend-web-app.yaml

          kubectl apply -f k8s/frontend-web-app.yaml
          kubectl rollout status deployment/web-app-${{ steps.setup-env.outputs.environment }} --namespace=frontend-web-app --timeout=300s

      - name: 验证部署
        run: |
          echo "验证部署状态..."
          kubectl get pods --namespace=frontend-web-app -l environment=${{ steps.setup-env.outputs.environment }}
          kubectl get service --namespace=frontend-web-app

      - name: 健康检查
        run: |
          echo "执行健康检查..."
          sleep 30  # 等待服务启动

          # 获取服务 URL
          SERVICE_URL=$(kubectl get ingress web-app-${{ steps.setup-env.outputs.environment }} --namespace=frontend-web-app -o jsonpath='{.spec.rules[0].host}')
          echo "服务地址: $SERVICE_URL"

          # 执行健康检查（仅在开发环境）
          if [[ "${{ steps.setup-env.outputs.environment }}" == "develop" ]]; then
            curl -f "http://$SERVICE_URL/health" || echo "健康检查失败，但部署可能仍在进行中"
          fi

  notify:
    needs: [detect-changes, test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 部署结果通知
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "🎉 前端服务部署成功!"
            echo "分支: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "环境: ${{ steps.setup-env.outputs.environment }}"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "❌ 前端服务部署失败!"
            echo "请检查日志并修复问题。"
          elif [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ 测试失败，部署已取消!"
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ 构建失败，部署已取消!"
          else
            echo "ℹ️ 跳过部署 - 没有检测到相关变更。"
          fi

  # 可选：性能测试
  performance-test:
    needs: [deploy]
    if: |
      needs.deploy.result == 'success' &&
      github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 等待服务就绪
        run: sleep 60

      - name: 执行性能测试
        run: |
          echo "执行 Lighthouse 性能测试..."
          # 这里可以添加 Lighthouse 或其他性能测试工具
          echo "性能测试完成"