# 后端服务本地化部署 Workflow
name: Deploy Backend Services (Local)

on:
  push:
    branches: [develop, staging, prod]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'k8s/*.yaml'
      - 'scripts/**'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'k8s/*.yaml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      first-app: ${{ steps.changes.outputs.first-app }}
      second-app: ${{ steps.changes.outputs.second-app }}
      should-deploy: ${{ steps.changes.outputs.should-deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检测文件变更
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            first-app:
              - 'backend/app/first_app/**'
              - 'docker/first-app/**'
            second-app:
              - 'backend/app/second_app/**'
              - 'docker/second-app/**'
            deploy-files:
              - 'k8s/local-dev-apps.yaml'
              - 'scripts/build.sh'
            shared-config:
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'scripts/build.sh'

      - name: 设置部署标志
        run: |
          if [[ "${{ steps.changes.outputs.first-app }}" == "true" || "${{ steps.changes.outputs.second-app }}" == "true" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.should-deploy == 'true'
    runs-on: self-hosted
    strategy:
      matrix:
        service: [first-app, second-app]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取环境
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=develop" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/${{ matrix.service }}/Dockerfile.develop" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/${{ matrix.service }}/Dockerfile.staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/${{ matrix.service }}/Dockerfile.prod" >> $GITHUB_OUTPUT
          else
            echo "environment=develop" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/${{ matrix.service }}/Dockerfile.develop" >> $GITHUB_OUTPUT
          fi

      - name: 检查服务变更
        id: check-service
        run: |
          service="${{ matrix.service }}"
          if [[ "${{ needs.detect-changes.outputs.${{ matrix.service }} }}" == "true" || "${{ needs.detect-changes.outputs.shared-config }}" == "true" || "${{ needs.detect-changes.outputs.deploy-files }}" == "true" ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
          fi

      - name: 本地构建 Docker 镜像
        if: steps.check-service.outputs.should-build == 'true'
        run: |
          echo "🐳 构建 ${{ matrix.service }} 镜像..."
          docker build -f ${{ steps.env.outputs.dockerfile }} -t ${{ matrix.service }}:${{ steps.env.outputs.environment }} .

          # 为开发环境创建 latest 标签
          if [[ "${{ steps.env.outputs.environment }}" == "develop" ]]; then
            docker tag ${{ matrix.service }}:${{ steps.env.outputs.environment }} ${{ matrix.service }}:latest
          fi

          echo "✅ ${{ matrix.service }} 镜像构建完成"
          docker images | grep ${{ matrix.service }}

  deploy:
    needs: [detect-changes, build]
    if: |
      needs.detect-changes.outputs.should-deploy == 'true' &&
      github.event_name == 'push' &&
      needs.build.result == 'success'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置环境变量
        id: setup-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=develop" >> $GITHUB_OUTPUT
            echo "url=http://localhost/first-app/hello" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "url=http://localhost/first-app/hello" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "url=http://localhost/first-app/hello" >> $GITHUB_OUTPUT
          fi

      - name: 验证 K8s 集群连接
        run: |
          if ! kubectl cluster-info &> /dev/null; then
            echo "❌ 无法连接到 Kubernetes 集群"
            exit 1
          fi
          echo "✅ Kubernetes 集群连接验证成功"

      - name: 部署到本地 Kubernetes
        run: |
          echo "🚀 开始部署到本地 K8s 集群..."
          echo "环境: ${{ steps.setup-env.outputs.environment }}"

          # 应用配置文件
          kubectl apply -f k8s/local-dev-apps.yaml

          # 等待部署完成
          echo "⏳ 等待部署完成..."
          kubectl rollout status deployment/app-first-app-${{ steps.setup-env.outputs.environment }} --namespace=app --timeout=120s
          kubectl rollout status deployment/app-second-app-${{ steps.setup-env.outputs.environment }} --namespace=app --timeout=120s

      - name: 验证部署状态
        run: |
          echo "📊 验证部署状态..."
          kubectl get pods --namespace=app
          kubectl get services --namespace=app
          kubectl get ingressroutes --namespace=app

      - name: 健康检查
        run: |
          echo "🧪 执行健康检查..."
          sleep 10  # 等待服务启动

          # 检查 first-app
          if [[ "${{ needs.detect-changes.outputs.first-app }}" == "true" || "${{ needs.detect-changes.outputs.shared-config }}" == "true" ]]; then
            echo "测试 first-app..."
            curl -f http://localhost/first-app/ping || echo "⚠️ first-app 健康检查失败"
          fi

          # 检查 second-app
          if [[ "${{ needs.detect-changes.outputs.second-app }}" == "true" || "${{ needs.detect-changes.outputs.shared-config }}" == "true" ]]; then
            echo "测试 second-app..."
            curl -f http://localhost/second-app/ping || echo "⚠️ second-app 健康检查失败"
          fi

  notify:
    needs: [detect-changes, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 部署结果通知
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "🎉 后端服务部署成功!"
            echo "分支: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "环境: ${{ steps.setup-env.outputs.environment }}"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "❌ 后端服务部署失败!"
            echo "请检查日志并修复问题。"
          else
            echo "ℹ️ 跳过部署 - 没有检测到相关变更。"
          fi    


