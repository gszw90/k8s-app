name: Deploy Backend to Local K8s

on:
  push:
    branches:
      - backend-first-app-develop
      - backend-first-app-staging
      - backend-first-app-prod
      - backend-second-app-develop
      - backend-second-app-staging
      - backend-second-app-prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'develop'
        type: choice
        options:
        - develop
        - staging
        - prod
      project:
        description: 'Target project'
        required: true
        default: 'first-app'
        type: choice
        options:
        - first-app
        - second-app

env:
  NAMESPACE: app

jobs:
  deploy:
    runs-on: self-hosted
    outputs:
      app-name: ${{ steps.parse.outputs.app-name }}
      environment: ${{ steps.parse.outputs.environment }}
      deployment-name: ${{ steps.parse.outputs.deployment-name }}
      image-name: ${{ steps.parse.outputs.image-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse branch info and set environment variables
        id: parse
        run: |
          set -e

          # 获取分支名
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"

          # 自动解析分支名
          if [[ "$BRANCH" =~ ^backend-(.+)-(.+)$ ]]; then
            PROJECT_NAME="${BASH_REMATCH[1]}"
            ENVIRONMENT="${BASH_REMATCH[2]}"
          else
            # 手动触发时使用输入参数
            PROJECT_NAME="${{ github.event.inputs.project || 'first-app' }}"
            ENVIRONMENT="${{ github.event.inputs.environment || 'develop' }}"
          fi

          echo "Project: $PROJECT_NAME"
          echo "Environment: $ENVIRONMENT"

          # 设置应用名称和镜像名称
          if [[ "$PROJECT_NAME" == "first-app" ]]; then
            APP_NAME="first-app"
            IMAGE_NAME="first-app"
            PORT="18080"
          elif [[ "$PROJECT_NAME" == "second-app" ]]; then
            APP_NAME="second-app"
            IMAGE_NAME="second-app"
            PORT="18081"
          else
            echo "❌ Unknown project: $PROJECT_NAME"
            exit 1
          fi

          DEPLOYMENT_NAME="app-$APP_NAME-$ENVIRONMENT"

          # 输出变量
          echo "app-name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "deployment-name=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT
          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT

          # 设置环境变量
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV

      - name: Get Git commit info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "Git Commit: $COMMIT_SHA"

      - name: Show deployment configuration
        run: |
          echo "🚀 Deployment Configuration:"
          echo "  Project: ${{ steps.parse.outputs.app-name }}"
          echo "  Environment: ${{ steps.parse.outputs.environment }}"
          echo "  Deployment Name: ${{ steps.parse.outputs.deployment-name }}"
          echo "  Image Name: ${{ steps.parse.outputs.image-name }}"
          echo "  Port: ${{ steps.parse.outputs.port }}"
          echo "  Commit: $COMMIT_SHA"

      - name: Verify kubectl connection
        run: |
          if ! kubectl cluster-info &> /dev/null; then
            echo "❌ Cannot connect to Kubernetes cluster"
            exit 1
          fi
          echo "✅ Kubernetes cluster connection verified"

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base configurations
        run: |
          echo "⚙️ Applying base configurations..."
          kubectl apply -f backend/deploy/k8s/namespace.yaml

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image: ${{ steps.parse.outputs.image-name }}:$COMMIT_SHA"

          # 根据项目构建对应的镜像
          if [[ "${{ steps.parse.outputs.app-name }}" == "first-app" ]]; then
            cd backend/app/first_app
            docker build -t first-app:$COMMIT_SHA .
            docker tag first-app:$COMMIT_SHA first-app:latest
          else
            cd backend/app/second_app
            docker build -t second-app:$COMMIT_SHA .
            docker tag second-app:$COMMIT_SHA second-app:latest
          fi

          echo "✅ Docker image built successfully"

      - name: Update deployment with new image
        run: |
          echo "🔄 Updating deployment with new image..."

          # 更新对应的部署文件
          DEPLOYMENT_FILE="backend/deploy/k8s/${{ steps.parse.outputs.app-name }}-deployment.yaml"

          # 备份原文件
          cp $DEPLOYMENT_FILE $DEPLOYMENT_FILE.bak

          # 更新镜像标签
          sed -i "s|image: .*:latest|image: ${{ steps.parse.outputs.image-name }}:$COMMIT_SHA|g" $DEPLOYMENT_FILE

          # 应用部署
          kubectl apply -f $DEPLOYMENT_FILE

          echo "✅ Deployment applied successfully"

      - name: Wait for deployment to be ready
        run: |
          echo "⏳ Waiting for deployment to be ready..."
          kubectl wait --for=condition=available --timeout=60s deployment/${{ steps.parse.outputs.deployment-name }} -n ${{ env.NAMESPACE }} || {
            echo "❌ Deployment failed to become ready"
            echo "Pod status:"
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ steps.parse.outputs.app-name }},environment=${{ steps.parse.outputs.environment }}
            echo "Deployment description:"
            kubectl describe deployment/${{ steps.parse.outputs.deployment-name }} -n ${{ env.NAMESPACE }}
            exit 1
          }

      - name: Verify deployment and test endpoints
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "📊 Current Status:"
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ steps.parse.outputs.app-name }},environment=${{ steps.parse.outputs.environment }}

          echo ""
          echo "🌐 Service URL:"
          echo "  - http://${{ steps.parse.outputs.app-name }}-${{ steps.parse.outputs.environment }}.localhost"

          echo ""
          echo "🧪 Testing endpoints..."

          # 等待服务完全启动
          sleep 5

          # 测试 ping 端点
          echo "Testing /ping endpoint..."
          kubectl run test-${{ steps.parse.outputs.app-name }}-ping --image=curlimages/curl --rm -i --restart=Never -n ${{ env.NAMESPACE }} -- \
            curl -f http://app-${{ steps.parse.outputs.deployment-name }}.${{ env.NAMESPACE }}.svc.cluster.local:${{ steps.parse.outputs.port }}/ping || echo "⚠️ Ping test failed"

          # 测试 hello 端点
          echo "Testing /hello endpoint..."
          kubectl run test-${{ steps.parse.outputs.app-name }}-hello --image=curlimages/curl --rm -i --restart=Never -n ${{ env.NAMESPACE }} -- \
            curl -f http://app-${{ steps.parse.outputs.deployment-name }}.${{ env.NAMESPACE }}.svc.cluster.local:${{ steps.parse.outputs.port }}/hello || echo "⚠️ Hello test failed"

          echo ""
          echo "🔍 Check logs with:"
          echo "  kubectl logs -n ${{ env.NAMESPACE }} deployment/${{ steps.parse.outputs.deployment-name }} -f"

      - name: Cleanup old Docker images
        if: always()
        run: |
          echo "🧹 Cleaning up old Docker images..."
          # 保留最新的5个镜像，删除其他的
          docker images ${{ steps.parse.outputs.image-name }} --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}" | tail -n +6 | awk '{print $2}' | xargs -r docker rmi || true
          echo "✅ Cleanup completed"

      - name: Restore deployment file
        if: always()
        run: |
          # 恢复原始部署文件
          if [ -f "backend/deploy/k8s/${{ steps.parse.outputs.app-name }}-deployment.yaml.bak" ]; then
            mv backend/deploy/k8s/${{ steps.parse.outputs.app-name }}-deployment.yaml.bak backend/deploy/k8s/${{ steps.parse.outputs.app-name }}-deployment.yaml
            echo "✅ Deployment file restored"
          fi