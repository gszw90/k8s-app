name: Deploy to Local K8s

on:
  push:
    branches:
      - '*-develop'
      - '*-staging'
      - '*-prod'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: localhost:5000
  NAMESPACE: app

jobs:
  # 解析分支信息并设置环境变量
  parse-branch-info:
    runs-on: self-hosted
    outputs:
      project-type: ${{ steps.parse.outputs.project-type }}
      project-name: ${{ steps.parse.outputs.project-name }}
      environment: ${{ steps.parse.outputs.environment }}
      deployment-name: ${{ steps.parse.outputs.deployment-name }}
      docker-image-name: ${{ steps.parse.outputs.docker-image-name }}
      should-deploy: ${{ steps.parse.outputs.should-deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Parse branch information
        id: parse
        run: |
          set -e

          # 获取分支名
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch: $BRANCH_NAME"

          # 解析分支名: project-type-project-name-environment
          if [[ $BRANCH_NAME =~ ^([^-]+)-([^-]+)-(.+)$ ]]; then
            PROJECT_TYPE="${BASH_REMATCH[1]}"
            PROJECT_NAME="${BASH_REMATCH[2]}"
            ENVIRONMENT="${BASH_REMATCH[3]}"

            echo "Project Type: $PROJECT_TYPE"
            echo "Project Name: $PROJECT_NAME"
            echo "Environment: $ENVIRONMENT"

            # 验证项目类型
            if [[ ! "$PROJECT_TYPE" =~ ^(backend|frontend)$ ]]; then
              echo "❌ Invalid project type: $PROJECT_TYPE"
              echo "should-deploy=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            # 验证环境
            if [[ ! "$ENVIRONMENT" =~ ^(develop|staging|prod)$ ]]; then
              echo "❌ Invalid environment: $ENVIRONMENT"
              echo "should-deploy=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            # 设置部署名称
            DEPLOYMENT_NAME="app-${PROJECT_NAME}-${ENVIRONMENT}"

            # 设置 Docker 镜像名称
            if [[ "$PROJECT_TYPE" == "backend" && "$PROJECT_NAME" == "first-app" ]]; then
              DOCKER_IMAGE_NAME="first-app"
            elif [[ "$PROJECT_TYPE" == "backend" && "$PROJECT_NAME" == "second-app" ]]; then
              DOCKER_IMAGE_NAME="second-app"
            elif [[ "$PROJECT_TYPE" == "frontend" && "$PROJECT_NAME" == "web" ]]; then
              DOCKER_IMAGE_NAME="web-app"
            else
              echo "❌ Unknown project: $PROJECT_TYPE-$PROJECT_NAME"
              echo "should-deploy=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            # 输出变量
            echo "project-type=$PROJECT_TYPE" >> $GITHUB_OUTPUT
            echo "project-name=$PROJECT_NAME" >> $GITHUB_OUTPUT
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
            echo "deployment-name=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT
            echo "docker-image-name=$DOCKER_IMAGE_NAME" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT

            # 设置环境变量供后续步骤使用
            echo "PROJECT_TYPE=$PROJECT_TYPE" >> $GITHUB_ENV
            echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
            echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
            echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> $GITHUB_ENV
            echo "DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME" >> $GITHUB_ENV

          else
            echo "❌ Branch name does not follow pattern: project-type-project-name-environment"
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Get Git commit info
        if: steps.parse.outputs.should-deploy == 'true'
        id: git-info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          echo "commit-sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit-message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV

      - name: Display deployment info
        if: steps.parse.outputs.should-deploy == 'true'
        run: |
          echo "🚀 Deployment Configuration:"
          echo "  Project Type: ${{ steps.parse.outputs.project-type }}"
          echo "  Project Name: ${{ steps.parse.outputs.project-name }}"
          echo "  Environment: ${{ steps.parse.outputs.environment }}"
          echo "  Deployment Name: ${{ steps.parse.outputs.deployment-name }}"
          echo "  Docker Image: ${{ steps.parse.outputs.docker-image-name }}"
          echo "  Commit SHA: ${{ steps.git-info.outputs.commit-sha }}"
          echo "  Commit Message: ${{ steps.git-info.outputs.commit-message }}"

  # 构建 Docker 镜像
  build-image:
    runs-on: self-hosted
    needs: parse-branch-info
    if: needs.parse-branch-info.outputs.should-deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image: ${{ needs.parse-branch-info.outputs.docker-image-name }}:${{ needs.parse-branch-info.outputs.commit-sha }}"

          # 根据项目类型构建镜像
          if [[ "${{ needs.parse-branch-info.outputs.project-type }}" == "backend" && "${{ needs.parse-branch-info.outputs.project-name }}" == "first-app" ]]; then
            cd backend/app/first_app
            docker build -t first-app:${{ needs.parse-branch-info.outputs.commit-sha }} .
            docker tag first-app:${{ needs.parse-branch-info.outputs.commit-sha }} first-app:latest

          elif [[ "${{ needs.parse-branch-info.outputs.project-type }}" == "backend" && "${{ needs.parse-branch-info.outputs.project-name }}" == "second-app" ]]; then
            cd backend/app/second_app
            docker build -t second-app:${{ needs.parse-branch-info.outputs.commit-sha }} .
            docker tag second-app:${{ needs.parse-branch-info.outputs.commit-sha }} second-app:latest

          elif [[ "${{ needs.parse-branch-info.outputs.project-type }}" == "frontend" && "${{ needs.parse-branch-info.outputs.project-name }}" == "web" ]]; then
            cd frontend/first_app
            docker build -t web-app:${{ needs.parse-branch-info.outputs.commit-sha }} .
            docker tag web-app:${{ needs.parse-branch-info.outputs.commit-sha }} web-app:latest
          fi

      - name: Verify Docker image
        run: |
          docker images | grep "${{ needs.parse-branch-info.outputs.docker-image-name }}"

      - name: Clean up old images (keep last 5)
        run: |
          # 清理旧镜像，保留最新的5个
          docker images ${{ needs.parse-branch-info.outputs.docker-image-name }} --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}" | tail -n +6 | awk '{print $2}' | xargs -r docker rmi || true

  # 部署到 Kubernetes
  deploy-to-k8s:
    runs-on: self-hosted
    needs: [parse-branch-info, build-image]
    if: needs.parse-branch-info.outputs.should-deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify kubectl connection
        run: |
          if ! kubectl cluster-info &> /dev/null; then
            echo "❌ Cannot connect to Kubernetes cluster"
            exit 1
          fi
          echo "✅ Kubernetes cluster connection verified"

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base configurations
        run: |
          echo "⚙️ Applying base configurations..."
          kubectl apply -f backend/deploy/k8s/namespace.yaml

      - name: Update K8s deployment with new image
        run: |
          echo "🔄 Updating deployment with new image..."

          # 更新镜像标签
          if [[ "${{ needs.parse-branch-info.outputs.project-type }}" == "backend" ]]; then
            DEPLOYMENT_FILE="backend/deploy/k8s/${{ needs.parse-branch-info.outputs.project-name }}-deployment.yaml"

            # 使用 sed 替换镜像标签
            sed -i.bak "s|image: .*:latest|image: ${{ needs.parse-branch-info.outputs.docker-image-name }}:${{ needs.parse-branch-info.outputs.commit-sha }}|g" $DEPLOYMENT_FILE

            # 应用部署
            kubectl apply -f $DEPLOYMENT_FILE

            # 恢复原始文件（可选）
            mv $DEPLOYMENT_FILE.bak $DEPLOYMENT_FILE

          elif [[ "${{ needs.parse-branch-info.outputs.project-type }}" == "frontend" ]]; then
            DEPLOYMENT_FILE="frontend/first_app/deploy/k8s/web-deployment.yaml"

            # 使用 sed 替换镜像标签
            sed -i.bak "s|image: .*:latest|image: ${{ needs.parse-branch-info.outputs.docker-image-name }}:${{ needs.parse-branch-info.outputs.commit-sha }}|g" $DEPLOYMENT_FILE

            # 应用部署
            kubectl apply -f $DEPLOYMENT_FILE

            # 恢复原始文件（可选）
            mv $DEPLOYMENT_FILE.bak $DEPLOYMENT_FILE
          fi

      - name: Wait for deployment to be ready
        run: |
          echo "⏳ Waiting for deployment to be ready..."
          kubectl wait --for=condition=available --timeout=120s deployment/${{ needs.parse-branch-info.outputs.deployment-name }} -n ${{ env.NAMESPACE }} || {
            echo "❌ Deployment failed to become ready"
            kubectl get pods -n ${{ env.NAMESPACE }} -l environment=${{ needs.parse-branch-info.outputs.environment }}
            kubectl describe deployment/${{ needs.parse-branch-info.outputs.deployment-name }} -n ${{ env.NAMESPACE }}
            exit 1
          }

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "📊 Deployment Status:"
          kubectl get pods -n ${{ env.NAMESPACE }} -l environment=${{ needs.parse-branch-info.outputs.environment }}

          echo ""
          echo "🌐 Service URLs:"
          if [[ "${{ needs.parse-branch-info.outputs.project-name }}" == "first-app" ]]; then
            echo "  - http://first-app-${{ needs.parse-branch-info.outputs.environment }}.localhost"
          elif [[ "${{ needs.parse-branch-info.outputs.project-name }}" == "second-app" ]]; then
            echo "  - http://second-app-${{ needs.parse-branch-info.outputs.environment }}.localhost"
          elif [[ "${{ needs.parse-branch-info.outputs.project-name }}" == "web" ]]; then
            echo "  - http://web-${{ needs.parse-branch-info.outputs.environment }}.localhost"
          fi

          echo ""
          echo "🔍 Check logs:"
          echo "  kubectl logs -n ${{ env.NAMESPACE }} deployment/${{ needs.parse-branch-info.outputs.deployment-name }}"

      - name: Test endpoints
        run: |
          echo "🧪 Testing application endpoints..."

          # 根据项目类型测试不同的端点
          if [[ "${{ needs.parse-branch-info.outputs.project-type }}" == "backend" ]]; then
            # 测试后端服务
            if [[ "${{ needs.parse-branch-info.outputs.project-name }}" == "first-app" ]]; then
              PORT="18080"
            else
              PORT="18081"
            fi

            # 等待服务启动
            sleep 10

            # 测试 ping 端点
            echo "Testing /ping endpoint..."
            kubectl run test-pod --image=curlimages/curl --rm -i --restart=Never -n ${{ env.NAMESPACE }} -- \
              curl -f http://app-${{ needs.parse-branch-info.outputs.deployment-name }}.${{ env.NAMESPACE }}.svc.cluster.local:$PORT/ping || echo "⚠️ Endpoint test failed"

          elif [[ "${{ needs.parse-branch-info.outputs.project-type }}" == "frontend" ]]; then
            # 测试前端服务
            echo "Testing /health endpoint..."
            kubectl run test-pod --image=curlimages/curl --rm -i --restart=Never -n ${{ env.NAMESPACE }} -- \
              curl -f http://app-${{ needs.parse-branch-info.outputs.deployment-name }}.${{ env.NAMESPACE }}.svc.cluster.local:3000/health || echo "⚠️ Endpoint test failed"
          fi

  # 发送通知（可选）
  notify:
    runs-on: self-hosted
    needs: [parse-branch-info, deploy-to-k8s]
    if: always() && needs.parse-branch-info.outputs.should-deploy == 'true'
    steps:
      - name: Deployment Summary
        run: |
          if [[ "${{ needs.deploy-to-k8s.result }}" == "success" ]]; then
            echo "🎉 Deployment completed successfully!"
            echo "Project: ${{ needs.parse-branch-info.outputs.project-type }}-${{ needs.parse-branch-info.outputs.project-name }}"
            echo "Environment: ${{ needs.parse-branch-info.outputs.environment }}"
            echo "Image: ${{ needs.parse-branch-info.outputs.docker-image-name }}:${{ needs.parse-branch-info.outputs.commit-sha }}"
          else
            echo "❌ Deployment failed!"
            echo "Please check the logs above for details."
          fi