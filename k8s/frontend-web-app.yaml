# Frontend Web App - 所有环境的 K8s 配置
---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: frontend-web-app
  labels:
    name: frontend-web-app
    environment: shared
    purpose: application-deployment
---
# ConfigMap - 开发环境
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config-develop
  namespace: frontend-web-app
data:
  LOG_LEVEL: "debug"
  NODE_ENV: "development"
  VERSION: "1.0.0-develop"
---
# ConfigMap - 预发布环境
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config-staging
  namespace: frontend-web-app
data:
  LOG_LEVEL: "info"
  NODE_ENV: "staging"
  VERSION: "1.0.0-staging"
---
# ConfigMap - 生产环境
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config-prod
  namespace: frontend-web-app
data:
  LOG_LEVEL: "error"
  NODE_ENV: "production"
  VERSION: "1.0.0-prod"
---
# Deployment - 开发环境
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-develop
  namespace: frontend-web-app
  labels:
    app: web-app
    environment: develop
    version: develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
      environment: develop
  template:
    metadata:
      labels:
        app: web-app
        environment: develop
        version: develop
    spec:
      containers:
      - name: web-app
        image: web-app:develop
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: web-app-config-develop
        env:
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
# Deployment - 预发布环境
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-staging
  namespace: frontend-web-app
  labels:
    app: web-app
    environment: staging
    version: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
      environment: staging
  template:
    metadata:
      labels:
        app: web-app
        environment: staging
        version: staging
    spec:
      containers:
      - name: web-app
        image: web-app:staging
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: web-app-config-staging
        env:
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
# Deployment - 生产环境
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-prod
  namespace: frontend-web-app
  labels:
    app: web-app
    environment: prod
    version: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
      environment: prod
  template:
    metadata:
      labels:
        app: web-app
        environment: prod
        version: prod
    spec:
      containers:
      - name: web-app
        image: web-app:prod
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: web-app-config-prod
        env:
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
# Service - 开发环境
apiVersion: v1
kind: Service
metadata:
  name: web-app-develop
  namespace: frontend-web-app
  labels:
    app: web-app
    environment: develop
spec:
  selector:
    app: web-app
    environment: develop
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
# Service - 预发布环境
apiVersion: v1
kind: Service
metadata:
  name: web-app-staging
  namespace: frontend-web-app
  labels:
    app: web-app
    environment: staging
spec:
  selector:
    app: web-app
    environment: staging
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
# Service - 生产环境
apiVersion: v1
kind: Service
metadata:
  name: web-app-prod
  namespace: frontend-web-app
  labels:
    app: web-app
    environment: prod
spec:
  selector:
    app: web-app
    environment: prod
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
# Ingress - 开发环境
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-develop
  namespace: frontend-web-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: "frontend-web-app-headers-develop@kubernetescrd"
spec:
  rules:
  - host: "web-develop.localhost"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-develop
            port:
              number: 3000
---
# Ingress - 预发布环境
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-staging
  namespace: frontend-web-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "frontend-web-app-headers-staging@kubernetescrd"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - "web-staging.example.com"
    secretName: web-app-staging-tls
  rules:
  - host: "web-staging.example.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-staging
            port:
              number: 3000
---
# Ingress - 生产环境
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-prod
  namespace: frontend-web-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "frontend-web-app-headers-prod@kubernetescrd"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - "web.example.com"
    secretName: web-app-prod-tls
  rules:
  - host: "web.example.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-prod
            port:
              number: 3000
---
# Middleware - 开发环境
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers-develop
  namespace: frontend-web-app
spec:
  headers:
    customRequestHeaders:
      X-Environment: "develop"
      X-Forwarded-Proto: "http"
---
# Middleware - 预发布环境
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers-staging
  namespace: frontend-web-app
spec:
  headers:
    customRequestHeaders:
      X-Environment: "staging"
      X-Forwarded-Proto: "https"
---
# Middleware - 生产环境
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers-prod
  namespace: frontend-web-app
spec:
  headers:
    customRequestHeaders:
      X-Environment: "production"
      X-Forwarded-Proto: "https"